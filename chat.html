<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat</title>
</head>
<body>
    <h2>chat</h2>

    <div class="hello">
        <form id="chatform">
            <input id="message" type="text" placeholder="Type your message" required><br>
            <button type="submit">Send</button>
        </form>
    </div>

    <h1 id="chatresult">Chat result will appear here</h1>

    <script>
        const form = document.getElementById('chatform');
        const chatResultEl = document.getElementById('chatresult');

        form.addEventListener('submit', e => {
            e.preventDefault();
            const message = document.getElementById('message').value;

            fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: message })
            })

            .then(response => {
                if (!response.ok) return response.json().then(err => { throw err; });
                return response.json();
            })
            .then(data => {
                if (data.reply !== undefined) {
                    chatResultEl.textContent = 'Reply: ' + data.reply;
                } else {
                    chatResultEl.textContent = 'Error: ' + (data.error || 'Unknown error');
                }
            })
            .catch(err => {
                chatResultEl.textContent = 'Failed to send message';
                console.error('Error:', err);
            });
        });
    </script>
</body>
</html>
